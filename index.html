<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<title>Jarvis</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; background: #000; color: #ddd;
    font-family: -apple-system, Helvetica, Arial, sans-serif; -webkit-user-select: none;
    -webkit-touch-callout: none; overflow: hidden; }
  .tela { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none;
    overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .tela.ativa { display: block; }
  button { font-family: inherit; -webkit-appearance: none; border: 0; cursor: pointer; }

  /* ---------- Noite ---------- */
  #noite { background: #000; text-align: center; }
  #n-relogio { color: #7a1414; font-size: 25vw; font-weight: 200; line-height: 1;
    margin-top: 16vh; letter-spacing: -0.02em; }
  #n-data { color: #4a0e0e; font-size: 3.4vw; margin-top: 1vh; }
  #n-plano { color: #4a0e0e; font-size: 2.8vw; margin-top: 4vh; min-height: 3.5vw; }
  #n-aviso { color: #a33; font-size: 2.6vw; margin-top: 2vh; display: none; }
  #n-botoes { position: absolute; left: 0; right: 0; bottom: 5vh; }
  .btn-noite { background: #140404; color: #6a1a1a; border: 1px solid #2a0808;
    font-size: 2.6vw; padding: 1.6vw 3.4vw; border-radius: 3vw; margin: 0 1vw; vertical-align: middle; }
  /* botão principal: grande e fácil de tocar */
  #bt-boanoite { display: block; margin: 0 auto 2.4vh; width: 60vw; min-height: 12vh;
    font-size: 4.2vw; font-weight: 400; border-radius: 6vh; }
  #bt-engrenagem { position: absolute; top: 0; right: 0; width: 13vw; height: 13vw;
    background: transparent; color: #1c0505; font-size: 3vw; }
  #n-clima { display: none; }

  /* ---------- Modo acordado: relógio bonito ---------- */
  #noite.dia { color: #fff; background: #1c6ea4;
    -webkit-transition: background 2s; transition: background 2s; }
  #noite.dia.madrugada { background: linear-gradient(160deg, #0f2027 0%, #203a43 55%, #2c5364 100%); }
  #noite.dia.manha { background: linear-gradient(160deg, #1e3c72 0%, #2a5298 50%, #f7b267 100%); }
  #noite.dia.tarde { background: linear-gradient(160deg, #1c6ea4 0%, #3f97cf 55%, #9fd3ec 100%); }
  #noite.dia.entardecer { background: linear-gradient(160deg, #2c3e75 0%, #8e3e8f 55%, #f4a261 100%); }
  #noite.dia.anoitecer { background: linear-gradient(160deg, #141e30 0%, #243b55 60%, #3a4f7a 100%); }
  #noite.dia #n-relogio { color: #fff; font-weight: 100; margin-top: 12vh;
    text-shadow: 0 0.4vw 2vw rgba(0,0,0,0.25); }
  #noite.dia #n-data { color: rgba(255,255,255,0.92); font-size: 3.6vw; font-weight: 300;
    text-shadow: 0 0.2vw 1vw rgba(0,0,0,0.25); }
  #noite.dia #n-clima { display: block; color: rgba(255,255,255,0.9); font-size: 3vw;
    font-weight: 300; margin-top: 3vh; text-shadow: 0 0.2vw 1vw rgba(0,0,0,0.25); }
  #noite.dia #n-plano { color: rgba(255,255,255,0.75); }
  #noite.dia .btn-noite { background: rgba(255,255,255,0.16); color: #fff;
    border: 1px solid rgba(255,255,255,0.4); }
  #noite.dia #bt-boanoite { background: rgba(255,255,255,0.24); font-weight: 500; }
  #noite.dia #bt-engrenagem { color: rgba(255,255,255,0.3); }

  /* ---------- Escolha ---------- */
  #escolha { background: #050000; padding: 5vh 6vw; }
  #escolha h1, #ajustes h1 { color: #8a2a2a; font-weight: 300; font-size: 4.2vw; margin: 0 0 3vh; }
  .opcoes { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin: -1vw; }
  .opcao { width: 46%; margin: 1vw; padding: 3vw; text-align: left; background: #120303;
    color: #9a3a3a; border: 1px solid #2a0a0a; border-radius: 2vw; }
  .opcao b { display: block; font-size: 3.2vw; font-weight: 500; margin-bottom: 0.8vw; }
  .opcao span { font-size: 2.2vw; color: #6a2424; }
  .opcao.marcada { border-color: #a33; background: #220606; }
  .linha-chuva { margin-top: 4vh; color: #7a2a2a; font-size: 2.4vw; }
  .chip { background: #120303; color: #7a2a2a; border: 1px solid #2a0a0a; border-radius: 5vw;
    padding: 1.2vw 2.6vw; margin: 1vw 0.6vw 0 0; font-size: 2.2vw; }
  .chip.marcada { border-color: #a33; color: #c55; }
  .acoes { margin-top: 4vh; }
  .btn-principal { background: #5a1010; color: #f2c0c0; font-size: 3vw; padding: 2vw 5vw; border-radius: 2vw; }
  .btn-sec { background: transparent; color: #6a2a2a; font-size: 2.6vw; padding: 2vw 3vw; }

  /* ---------- Confirmação ---------- */
  #confirmado { background: #000; text-align: center; padding: 14vh 8vw 0; }
  #c-titulo { color: #9a3030; font-size: 4vw; font-weight: 300; }
  #c-detalhe { color: #6a2020; font-size: 2.8vw; margin-top: 2vh; }
  #c-alexa { color: #c06060; font-size: 3vw; margin: 5vh auto 0; max-width: 80vw;
    border: 1px solid #3a0c0c; border-radius: 2vw; padding: 3vw; line-height: 1.4; }

  /* ---------- Alarme ---------- */
  #alarme { background: #000; text-align: center; -webkit-transition: background 120s linear; transition: background 120s linear; }
  #alarme.claro { background: #c8742a; }
  #a-relogio { font-size: 22vw; font-weight: 200; color: #fff; margin-top: 12vh; line-height: 1; }
  #a-frase { font-size: 3.6vw; color: #fff; margin: 4vh 8vw 0; min-height: 5vw; line-height: 1.3; }
  #bt-parar { margin-top: 7vh; background: rgba(255,255,255,0.9); color: #222; font-size: 4vw;
    padding: 3vw 10vw; border-radius: 6vw; }

  /* ---------- Painel (manhã / clima) ---------- */
  #painel { background: #111214; color: #f2f2f2; padding: 4vh 5vw 6vh; }
  #p-topo { display: -webkit-flex; display: flex; -webkit-justify-content: space-between; justify-content: space-between;
    -webkit-align-items: baseline; align-items: baseline; }
  #p-hora { font-size: 9vw; font-weight: 200; }
  #p-dia { font-size: 2.4vw; color: #999; text-align: right; }
  .cartao { background: #1d1e21; border-radius: 2.4vw; padding: 2.6vw 3vw; margin-top: 2.4vw; }
  .cartao h2 { font-size: 2.1vw; text-transform: uppercase; letter-spacing: 0.08em; color: #8e8e93;
    margin: 0 0 1.6vw; font-weight: 600; }
  .periodos { display: -webkit-flex; display: flex; }
  .periodo { -webkit-flex: 1; flex: 1; text-align: center; }
  .periodo .nome { font-size: 2.2vw; color: #999; }
  .periodo .temp { font-size: 6vw; font-weight: 200; margin: 0.6vw 0; }
  .periodo .desc { font-size: 2vw; color: #bbb; }
  .linha { font-size: 2.6vw; line-height: 1.5; }
  .linha.alerta { color: #7fb7ff; }
  .grande { font-size: 6vw; font-weight: 200; }
  .pequeno { font-size: 2.1vw; color: #8e8e93; }
  .btn-painel { background: #2c2d31; color: #4ea1ff; font-size: 2.4vw; padding: 1.6vw 3vw; border-radius: 1.6vw; margin: 2vw 1.4vw 0 0; }
  #p-voltar { margin-top: 4vh; }

  /* ---------- Ajustes ---------- */
  #ajustes { background: #0a0a0a; color: #ccc; padding: 4vh 6vw 10vh; }
  #ajustes h1 { color: #ddd; }
  #ajustes h2 { font-size: 2.3vw; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.06em; margin: 4vh 0 1vh; }
  .campo { margin: 1.6vw 0; }
  .campo label { display: block; font-size: 2.2vw; color: #999; margin-bottom: 0.6vw; }
  .campo input, .campo select { width: 100%; font-size: 2.6vw; padding: 1.4vw; border-radius: 1.2vw;
    border: 1px solid #333; background: #151515; color: #fff; -webkit-user-select: text; }
  .campo input[type=time] { width: 30vw; }
  .achado { font-size: 2vw; color: #6c6; margin-top: 0.6vw; min-height: 2.4vw; }
  .achado.erro { color: #e66; }
  .horarios { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; }
  .horarios .campo { width: 33%; padding-right: 2vw; }
  .horarios .campo input { width: 100%; }
  #aj-msg { font-size: 2.4vw; color: #6c6; margin-top: 2vh; min-height: 3vw; }
  .btn-aj { background: #2a4b7c; color: #fff; font-size: 2.6vw; padding: 1.8vw 4vw; border-radius: 1.6vw; margin: 2vw 1.6vw 0 0; }
  .btn-aj.cinza { background: #333; }
  #aj-versao { font-size: 1.8vw; color: #555; margin-top: 4vh; }
</style>
</head>
<body>

<!-- Tela da noite: relógio -->
<div id="noite" class="tela ativa">
  <button id="bt-engrenagem" aria-label="Ajustes (segure 3 segundos)">&#9881;</button>
  <div id="n-relogio">--:--</div>
  <div id="n-data"></div>
  <div id="n-clima"></div>
  <div id="n-plano"></div>
  <div id="n-aviso">Toque na tela para ativar o som do alarme</div>
  <div id="n-botoes">
    <button class="btn-noite" id="bt-boanoite">Boa noite, Lucas</button>
    <button class="btn-noite" id="bt-parar-chuva" style="display:none">Parar chuva</button>
    <button class="btn-noite" id="bt-clima-noite">Clima</button>
  </div>
</div>

<!-- Escolha da rotina -->
<div id="escolha" class="tela">
  <h1 id="e-titulo">Boa noite, Lucas. Como vai ser amanhã?</h1>
  <div class="opcoes">
    <button class="opcao" data-op="A"><b>Levar a Gabi</b><span id="e-sub-A"></span></button>
    <button class="opcao" data-op="B"><b>Academia</b><span id="e-sub-B"></span></button>
    <button class="opcao" data-op="C"><b>Direto para o trabalho</b><span id="e-sub-C"></span></button>
    <button class="opcao" data-op="D"><b>Fim de semana</b><span>Sem alarme, só a previsão</span></button>
  </div>
  <div class="linha-chuva">Som de chuva:
    <div>
      <button class="chip" data-chuva="30">30 min</button>
      <button class="chip" data-chuva="60">1 hora</button>
      <button class="chip" data-chuva="90">1h30</button>
      <button class="chip" data-chuva="0">A noite toda</button>
      <button class="chip" data-chuva="-1">Sem chuva</button>
    </div>
  </div>
  <div class="acoes">
    <button class="btn-principal" id="bt-confirmar">Confirmar</button>
    <button class="btn-sec" id="bt-cancelar-escolha">Voltar</button>
  </div>
</div>

<!-- Confirmação com o lembrete do alarme do celular -->
<div id="confirmado" class="tela">
  <div id="c-titulo"></div>
  <div id="c-detalhe"></div>
  <div id="c-alexa"></div>
  <div class="acoes"><button class="btn-principal" id="bt-ok-confirmado">OK, boa noite</button></div>
</div>

<!-- Alarme tocando -->
<div id="alarme" class="tela">
  <div id="a-relogio">--:--</div>
  <div id="a-frase"></div>
  <button id="bt-parar">Parar</button>
</div>

<!-- Painel da manhã / clima -->
<div id="painel" class="tela">
  <div id="p-topo"><div id="p-hora">--:--</div><div id="p-dia"></div></div>
  <div class="cartao" id="p-cartao-clima">
    <h2 id="p-clima-titulo">Clima</h2>
    <div class="periodos" id="p-periodos"><div class="linha">Carregando...</div></div>
  </div>
  <div class="cartao" id="p-cartao-chuva">
    <h2>Chuva</h2>
    <div id="p-chuva"><div class="linha">Carregando...</div></div>
  </div>
  <div class="cartao" id="p-cartao-rota" style="display:none">
    <h2 id="p-rota-titulo">Trajeto</h2>
    <div id="p-rota"><div class="linha">Carregando...</div></div>
    <a id="p-mapas" href="#"><button class="btn-painel">Abrir no Mapas</button></a>
  </div>
  <div class="pequeno" id="p-atualizado" style="margin-top:2vw"></div>
  <div id="p-voltar">
    <button class="btn-painel" id="bt-atualizar">Atualizar</button>
    <button class="btn-painel" id="bt-voltar-relogio">Voltar ao relógio</button>
  </div>
</div>

<!-- Ajustes -->
<div id="ajustes" class="tela">
  <h1>Ajustes</h1>

  <h2>Endereços</h2>
  <div class="campo"><label>Casa</label><input id="aj-casa" type="text" autocomplete="off" autocorrect="off" spellcheck="false"><div class="achado" id="ac-casa"></div></div>
  <div class="campo"><label>Bar da Tilápia (deixar a Gabi)</label><input id="aj-bar" type="text" autocomplete="off" autocorrect="off" spellcheck="false"><div class="achado" id="ac-bar"></div></div>
  <div class="campo"><label>Trabalho</label><input id="aj-trabalho" type="text" autocomplete="off" autocorrect="off" spellcheck="false"><div class="achado" id="ac-trabalho"></div></div>

  <h2>Horários de alarme</h2>
  <div class="horarios">
    <div class="campo"><label>Levar a Gabi</label><input id="aj-hA" type="time"></div>
    <div class="campo"><label>Academia</label><input id="aj-hB" type="time"></div>
    <div class="campo"><label>Direto p/ trabalho</label><input id="aj-hC" type="time"></div>
    <div class="campo"><label>Alarme fixo do celular (seg a sex)</label><input id="aj-alexa" type="time"></div>
  </div>

  <h2>Som</h2>
  <div class="campo"><label>Volume da chuva</label>
    <select id="aj-volchuva"><option value="0.35">Baixo</option><option value="0.6">Médio</option><option value="0.9">Alto</option></select></div>
  <div class="campo"><label>Subida do alarme (de baixo até o máximo)</label>
    <select id="aj-subida"><option value="60">1 minuto</option><option value="120">2 minutos</option><option value="180">3 minutos</option></select></div>

  <h2>Trânsito</h2>
  <div class="campo"><label>Chave do TomTom</label><input id="aj-chave" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>

  <button class="btn-aj" id="bt-salvar">Salvar</button>
  <button class="btn-aj cinza" id="bt-teste-alarme">Testar alarme em 2 minutos</button>
  <button class="btn-aj cinza" id="bt-fechar-ajustes">Fechar</button>
  <div id="aj-msg"></div>
  <div id="aj-versao"></div>
</div>

<script>
(function () {
  'use strict';
  var VERSAO = '1.3 (05/11/2026)';

  // ====================================================================
  // Utilidades
  // ====================================================================
  function $(id) { return document.getElementById(id); }
  function dd(n) { return n < 10 ? '0' + n : '' + n; }
  function hhmm(d) { return dd(d.getHours()) + ':' + dd(d.getMinutes()); }
  var DIAS = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
  var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  function dataExtenso(d) { return DIAS[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()]; }
  function diaUtil(d) { var w = d.getDay(); return w >= 1 && w <= 5; }
  function chaveDia(d) { return d.getFullYear() + '-' + dd(d.getMonth() + 1) + '-' + dd(d.getDate()); }
  function lerJSON(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function gravarJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function falado(h) { // "06:40" -> "6 e 40"; "06:00" -> "6"
    var p = h.split(':'), hh = parseInt(p[0], 10), mm = parseInt(p[1], 10);
    return mm === 0 ? '' + hh : hh + ' e ' + mm;
  }
  function proximaOcorrencia(h, agora) { // próxima vez que o relógio marca h (HH:MM)
    var p = h.split(':'), d = new Date(agora.getTime());
    d.setHours(parseInt(p[0], 10), parseInt(p[1], 10), 0, 0);
    if (d.getTime() <= agora.getTime()) { d.setDate(d.getDate() + 1); }
    return d;
  }

  // ====================================================================
  // Configurações (ficam só neste iPad)
  // ====================================================================
  var PADRAO = {
    casa: 'Rua Apalaches, 332, Santo André, SP',
    bar: 'Rua Visconde de Taunay, 90, Centro, Santo André, SP, 09210-570',
    trabalho: 'Rua Maria da Conceição Stanwez, 162, São Paulo, SP',
    pos: {},           // coordenadas encontradas para cada endereço
    hA: '06:00', hB: '05:50', hC: '06:40', alexa: '06:00',
    volChuva: '0.6', subida: '60', chave: '', chuvaMin: '60'
  };
  var cfg = lerJSON('cab-config') || {};
  for (var k in PADRAO) { if (!(k in cfg)) { cfg[k] = PADRAO[k]; } }
  // v1.2: subida do alarme passa a ser de 1 minuto (pedido do Lucas)
  if (!cfg.versaoCfg || cfg.versaoCfg < 2) { cfg.subida = '60'; cfg.versaoCfg = 2; gravarJSON('cab-config', cfg); }
  if (!cfg.chave) { try { cfg.chave = localStorage.getItem('tomtom-chave') || ''; } catch (e) {} } // chave da página de teste
  function salvarCfg() { gravarJSON('cab-config', cfg); }

  var OPCOES = {
    A: { nome: 'Levar a Gabi', hora: function () { return cfg.hA; }, rota: ['casa', 'bar', 'trabalho'] },
    B: { nome: 'Academia', hora: function () { return cfg.hB; }, rota: null },
    C: { nome: 'Direto para o trabalho', hora: function () { return cfg.hC; }, rota: ['casa', 'trabalho'] },
    D: { nome: 'Fim de semana', hora: function () { return null; }, rota: null }
  };

  // Plano escolhido à noite: { op, alarmeEm (ms), diaAlvo, status: 'agendado'|'tocando'|'feito' }
  var plano = lerJSON('cab-plano');
  function salvarPlano() { gravarJSON('cab-plano', plano); }

  // ====================================================================
  // Telas
  // ====================================================================
  var telaAtual = 'noite';
  function mostrar(id) {
    var telas = document.querySelectorAll('.tela');
    for (var i = 0; i < telas.length; i++) { telas[i].className = 'tela'; }
    $(id).className = 'tela ativa';
    telaAtual = id;
  }

  // ====================================================================
  // Áudio. O iPad só libera som depois de um toque na tela.
  // Para parar um som, desligamos o "fio" (disconnect) e zeramos o volume:
  // no iOS 12 o comando stop() às vezes é ignorado.
  // ====================================================================
  var Ctx = window.AudioContext || window.webkitAudioContext;
  var ctx = null, somLiberado = false;
  function liberarSom() {
    if (!Ctx) { return; }
    try {
      if (!ctx) { ctx = new Ctx(); }
      if (ctx.state === 'suspended' && ctx.resume) { ctx.resume(); }
      var src = ctx.createBufferSource();
      src.buffer = ctx.createBuffer(1, 1, 22050);
      src.connect(ctx.destination);
      if (src.start) { src.start(0); } else { src.noteOn(0); }
      somLiberado = true;
      manterSomVivo();
      atualizarNoite();
    } catch (e) {}
  }
  document.addEventListener('touchend', liberarSom, false);
  document.addEventListener('click', liberarSom, false);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && ctx && ctx.state === 'suspended' && ctx.resume) { ctx.resume(); }
  });

  // Um chiado baixíssimo (inaudível) tocando sempre. Sem ele, quando o som para,
  // o iPad "solta" a caixa Bluetooth (Alexa) e o próximo som sai pelo próprio iPad.
  // Também ajuda a manter o som liberado a noite toda.
  var somVivo = null;
  function manterSomVivo() {
    if (somVivo || !ctx) { return; }
    try {
      var taxa = ctx.sampleRate, buf = ctx.createBuffer(1, taxa, taxa), d = buf.getChannelData(0);
      for (var i = 0; i < d.length; i++) { d[i] = Math.random() * 2 - 1; }
      var f = ctx.createBufferSource(), g = ctx.createGain();
      f.buffer = buf; f.loop = true; g.gain.value = 0.0004;
      f.connect(g); g.connect(ctx.destination); iniciar(f, 0);
      somVivo = f;
    } catch (e) {}
  }

  function iniciar(fonte, t) { if (fonte.start) { fonte.start(t); } else { fonte.noteOn(t); } }
  function desligar(no) { try { no.disconnect(); } catch (e) {} }

  // Gera um trecho de áudio que se repete sem emenda
  function gerarBuffer(segundos, preencher) {
    var taxa = ctx.sampleRate, n = Math.floor(segundos * taxa);
    var buf = ctx.createBuffer(2, n, taxa);
    preencher(buf.getChannelData(0), buf.getChannelData(1), taxa, n);
    return buf;
  }

  var cacheBuffers = {};
  function bufferChuva() {
    if (cacheBuffers.chuva) { return cacheBuffers.chuva; }
    cacheBuffers.chuva = gerarBuffer(8, function (L, R, taxa, n) {
      var canais = [L, R];
      for (var c = 0; c < 2; c++) {
        var d = canais[c], ultimo = 0;
        for (var i = 0; i < n; i++) {
          var b = Math.random() * 2 - 1;
          ultimo = (ultimo + 0.02 * b) / 1.02;
          var gota = Math.random() < 0.0004 ? (Math.random() * 2 - 1) * 0.3 : 0;
          d[i] = ultimo * 3.2 + gota * 0.25 + b * 0.04;
        }
        var em = Math.floor(taxa * 0.08);
        for (var j = 0; j < em; j++) { var f = j / em; d[n - em + j] = d[n - em + j] * (1 - f) + d[j] * f; }
      }
    });
    return cacheBuffers.chuva;
  }

  // Alarme suave: carrilhão de 3 notas a cada 2,5 s
  function bufferCarrilhao() {
    if (cacheBuffers.carrilhao) { return cacheBuffers.carrilhao; }
    cacheBuffers.carrilhao = gerarBuffer(2.5, function (L, R, taxa, n) {
      var notas = [[0, 659.25], [0.28, 830.61], [0.56, 987.77]];
      for (var i = 0; i < n; i++) {
        var t = i / taxa, v = 0;
        for (var k = 0; k < notas.length; k++) {
          var dt = t - notas[k][0];
          if (dt >= 0) {
            var env = Math.exp(-dt * 2.2) * Math.min(1, dt * 200);
            v += env * (Math.sin(2 * Math.PI * notas[k][1] * dt) * 0.6 + Math.sin(2 * Math.PI * notas[k][1] * 2 * dt) * 0.15);
          }
        }
        L[i] = R[i] = v * 0.45;
      }
    });
    return cacheBuffers.carrilhao;
  }

  // Academia: batida animada (128 bpm) com baixo e chimbal
  function bufferAnimado() {
    if (cacheBuffers.animado) { return cacheBuffers.animado; }
    var bpm = 128, batida = 60 / bpm, compassos = 4;
    cacheBuffers.animado = gerarBuffer(batida * 4 * compassos, function (L, R, taxa, n) {
      var baixo = [110, 110, 130.81, 146.83];       // Lá, Lá, Dó, Ré
      var melodia = [440, 523.25, 659.25, 587.33, 523.25, 659.25, 783.99, 659.25];
      for (var i = 0; i < n; i++) {
        var t = i / taxa, v = 0;
        var posBatida = t / batida, nb = Math.floor(posBatida), fb = (posBatida - nb) * batida;
        // bumbo em toda batida
        v += Math.sin(2 * Math.PI * (55 + 90 * Math.exp(-fb * 30)) * fb) * Math.exp(-fb * 9) * 0.9;
        // chimbal no contratempo
        var meio = t - (nb + 0.5) * batida;
        if (meio >= 0 && meio < 0.06) { v += (Math.random() * 2 - 1) * Math.exp(-meio * 60) * 0.25; }
        // baixo em colcheias
        var col = Math.floor(posBatida * 2), fc = t - col * batida / 2;
        var fBaixo = baixo[Math.floor(nb / 4) % 4];
        v += (Math.sin(2 * Math.PI * fBaixo * fc) > 0 ? 1 : -1) * Math.exp(-fc * 6) * 0.12;
        // melodia
        var fMel = melodia[col % 8];
        v += Math.sin(2 * Math.PI * fMel * fc) * Math.exp(-fc * 5) * 0.22;
        L[i] = R[i] = v * 0.55;
      }
    });
    return cacheBuffers.animado;
  }

  // ---------- Chuva ----------
  var chuva = { fonte: null, ganho: null, fimEm: 0 };
  function tocarChuva(minutos) {
    if (!ctx) { return; }
    pararChuva(true);
    var g = ctx.createGain(), f = ctx.createBufferSource();
    f.buffer = bufferChuva(); f.loop = true;
    var t = ctx.currentTime, vol = parseFloat(cfg.volChuva);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 5);
    f.connect(g); g.connect(ctx.destination); iniciar(f, 0);
    chuva.fonte = f; chuva.ganho = g;
    chuva.fimEm = minutos > 0 ? Date.now() + minutos * 60000 : 0;
    $('bt-parar-chuva').style.display = '';
  }
  function pararChuva(imediato) {
    if (!chuva.ganho) { return; }
    var g = chuva.ganho, f = chuva.fonte;
    chuva.ganho = chuva.fonte = null; chuva.fimEm = 0;
    $('bt-parar-chuva').style.display = 'none';
    if (imediato === true) { desligar(g); desligar(f); return; }
    // Botão "Parar chuva": some em 1,5 s. Fim do timer: vai sumindo em 1 minuto.
    var dur = imediato === 'rapido' ? 1.5 : 60;
    var t = ctx.currentTime;
    try {
      g.gain.cancelScheduledValues(0);
      g.gain.setValueAtTime(parseFloat(cfg.volChuva), t);
      g.gain.linearRampToValueAtTime(0.0001, t + dur);
    } catch (e) {}
    // Garantia: desliga de vez no fim, mesmo que o iPad ignore a rampa
    setTimeout(function () { desligar(g); desligar(f); }, dur * 1000 + 100);
  }

  // ---------- Alarme ----------
  var alarmeSom = { fonte: null, ganho: null };
  function tocarAlarmeSom(op) {
    if (!ctx) { return false; }
    pararAlarmeSom();

    f.buffer = op === 'B' ? bufferAnimado() : bufferCarrilhao();
    f.loop = true;
    var t = ctx.currentTime, sub = parseInt(cfg.subida, 10);
    g.gain.setValueAtTime(0.08, t);
    g.gain.linearRampToValueAtTime(1, t + sub);
    f.connect(g); g.connect(ctx.destination); iniciar(f, 0);
    alarmeSom.fonte = f; alarmeSom.ganho = g;
    return true;
  }
  function pararAlarmeSom() {
    if (alarmeSom.ganho) {
      try { alarmeSom.ganho.gain.cancelScheduledValues(0); alarmeSom.ganho.gain.value = 0; } catch (e) {}
      desligar(alarmeSom.ganho);
    }
    if (alarmeSom.fonte) { desligar(alarmeSom.fonte); }
    alarmeSom.fonte = alarmeSom.ganho = null;
  }

  // Modo acordado (fundo bonito) até tocar em "Boa noite"; modo noite (escuro) enquanto o alarme está marcado
  function faseDoDia(h) {

  // ====================================================================
  // Clima (Open-Meteo, gratuito) e trânsito (TomTom)
  // ====================================================================
  function buscar(url, ok, erro) {
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.timeout = 15000;
    x.onload = function () {
      if (x.status >= 200 && x.status < 300) { try { ok(JSON.parse(x.responseText)); } catch (e) { erro('resposta inválida'); } }
      else { erro('erro ' + x.status); }
    };
    x.onerror = function () { erro('sem internet'); };
    x.ontimeout = function () { erro('demorou demais'); };
    x.send();
  }

  var CODIGOS = {
    0: 'Céu limpo', 1: 'Poucas nuvens', 2: 'Parcialmente nublado', 3: 'Nublado', 45: 'Neblina', 48: 'Neblina',
    51: 'Garoa fraca', 53: 'Garoa', 55: 'Garoa forte', 56: 'Garoa', 57: 'Garoa',
    61: 'Chuva fraca', 63: 'Chuva', 65: 'Chuva forte', 66: 'Chuva', 67: 'Chuva forte',
    80: 'Pancadas fracas', 81: 'Pancadas de chuva', 82: 'Pancadas fortes', 95: 'Trovoadas', 96: 'Trovoadas', 99: 'Trovoadas fortes'
  };
  function intensidade(mm) { return mm >= 4 ? 'forte' : (mm >= 1 ? 'moderada' : 'fraca'); }

  var dados = lerJSON('cab-dados') || {};   // última resposta guardada (serve sem internet)

  function coordenadaClima() {
    var p = cfg.pos && cfg.pos.casa;
    return p ? p : { lat: -23.66, lon: -46.53 };   // centro de Santo André
  }

  function buscarClima(pronto) {
    var c = coordenadaClima();
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + c.lat + '&longitude=' + c.lon +
      '&hourly=temperature_2m,precipitation_probability,precipitation,weather_code' +
      '&daily=temperature_2m_max,temperature_2m_min&forecast_days=2&timezone=America%2FSao_Paulo';
    buscar(url, function (d) { dados.clima = d; dados.climaEm = Date.now(); gravarJSON('cab-dados', dados); pronto(); },
      function (m) { dados.climaErro = m; pronto(); });
  }

  function buscarRota(op, pronto) {
    var o = OPCOES[op];
    if (!o || !o.rota) { pronto(); return; }
    if (!cfg.chave) { dados.rotaErro = 'falta a chave do TomTom nos Ajustes'; pronto(); return; }
    var pts = [];
    for (var i = 0; i < o.rota.length; i++) {
      var p = cfg.pos && cfg.pos[o.rota[i]];
      if (!p) { dados.rotaErro = 'endereço "' + o.rota[i] + '" não encontrado; confira nos Ajustes'; pronto(); return; }
      pts.push(p.lat + ',' + p.lon);
    }
    var url = 'https://api.tomtom.com/routing/1/calculateRoute/' + pts.join(':') +
      '/json?traffic=true&travelMode=car&departAt=now&routeType=fastest&key=' + encodeURIComponent(cfg.chave);
    buscar(url, function (d) {
      var r = d.routes[0], pernas = [];
      for (var k = 0; k < r.legs.length; k++) { pernas.push(r.legs[k].summary.travelTimeInSeconds); }
      dados.rota = { op: op, total: r.summary.travelTimeInSeconds, atraso: r.summary.trafficDelayInSeconds || 0,
        km: r.summary.lengthInMeters / 1000, pernas: pernas, em: Date.now() };
      dados.rotaErro = null; gravarJSON('cab-dados', dados); pronto();
    }, function (m) { dados.rotaErro = m; pronto(); });
  }

  function buscarDados(op, depois) {
    var faltam = 2;
    function um() { faltam--; if (faltam === 0) { if (telaAtual === 'painel') { desenharPainel(); } if (depois) { depois(); } } }
    dados.climaErro = null;
    buscarClima(um); buscarRota(op, um);
  }

  // ====================================================================
  // Painel da manhã
  // ====================================================================
  var painelOp = null, painelAmanha = false;
  function abrirPainel(op, amanha) {
    painelOp = op; painelAmanha = amanha;
    mostrar('painel');
    desenharPainel();
    buscarDados(op);
  }

  function media(lista) { var s = 0; for (var i = 0; i < lista.length; i++) { s += lista[i]; } return lista.length ? s / lista.length : null; }
  function maisComum(lista) {
    var cont = {}, melhor = null, max = 0;
    for (var i = 0; i < lista.length; i++) {
      var c = lista[i]; cont[c] = (cont[c] || 0) + 1;
      // chuva conta mais que nuvem, para não esconder um período chuvoso
      var peso = cont[c] + (c >= 51 ? 0.5 : 0);
      if (peso > max) { max = peso; melhor = c; }
    }
    return melhor;
  }

  function desenharPainel() {
    var agora = new Date();
    $('p-hora').textContent = hhmm(agora);
    var dia = new Date(agora.getTime()); if (painelAmanha) { dia.setDate(dia.getDate() + 1); }
    $('p-dia').innerHTML = (painelAmanha ? 'Previsão para amanhã<br>' : '') + dataExtenso(dia);
    var alvo = chaveDia(dia);

    // ---- Clima ----
    var c = dados.clima;
    if (c && c.hourly) {
      var H = c.hourly, periodos = [['Manhã', 6, 11], ['Almoço', 11, 14], ['Tarde', 14, 18], ['Noite', 18, 22]];
      var html = '', alertas = [], blocoAtual = null;
      for (var p = 0; p < periodos.length; p++) {
        var temps = [], cods = [], probs = [];
        for (var i = 0; i < H.time.length; i++) {
          if (H.time[i].substr(0, 10) !== alvo) { continue; }
          var hr = parseInt(H.time[i].substr(11, 2), 10);
          if (hr >= periodos[p][1] && hr < periodos[p][2]) { temps.push(H.temperature_2m[i]); cods.push(H.weather_code[i]); probs.push(H.precipitation_probability[i] || 0); }
        }
        var m = media(temps);
        html += '<div class="periodo"><div class="nome">' + periodos[p][0] + '</div><div class="temp">' +
          (m === null ? '--' : Math.round(m) + '°') + '</div><div class="desc">' + (CODIGOS[maisComum(cods)] || '') +
          '<br>' + (probs.length ? 'chuva ' + Math.max.apply(null, probs) + '%' : '') + '</div></div>';
      }
      $('p-periodos').innerHTML = html;
      var tmax = null, tmin = null;
      if (c.daily) { for (var dI = 0; dI < c.daily.time.length; dI++) { if (c.daily.time[dI] === alvo) { tmax = c.daily.temperature_2m_max[dI]; tmin = c.daily.temperature_2m_min[dI]; } } }
      $('p-clima-titulo').textContent = 'Clima' + (tmax !== null ? ' · mín ' + Math.round(tmin) + '° / máx ' + Math.round(tmax) + '°' : '');

      // Alertas de chuva: agrupa horas seguidas com chance >= 40% ou chuva medida
      for (var k = 0; k < H.time.length; k++) {
        if (H.time[k].substr(0, 10) !== alvo) { continue; }
        var h2 = parseInt(H.time[k].substr(11, 2), 10);
        if (h2 < 5 || h2 > 23) { continue; }
        var prob = H.precipitation_probability[k] || 0, mm = H.precipitation[k] || 0;
        if (prob >= 40 || mm >= 0.3) {
          if (blocoAtual && blocoAtual.fim === h2) { blocoAtual.fim = h2 + 1; blocoAtual.mm = Math.max(blocoAtual.mm, mm); blocoAtual.prob = Math.max(blocoAtual.prob, prob); }
          else { blocoAtual = { ini: h2, fim: h2 + 1, mm: mm, prob: prob }; alertas.push(blocoAtual); }
        }
      }
      if (!alertas.length) { $('p-chuva').innerHTML = '<div class="linha">Sem chuva prevista. Pode deixar o guarda-chuva.</div>'; }
      else {
        var t = '';
        for (var a = 0; a < alertas.length; a++) {
          var al = alertas[a];
          t += '<div class="linha alerta">' + al.ini + 'h às ' + al.fim + 'h: chuva ' + intensidade(al.mm) +
            ' (até ' + al.mm.toFixed(1).replace('.', ',') + ' mm/h, chance ' + al.prob + '%)</div>';
        }
        $('p-chuva').innerHTML = t;
      }
    } else {
      $('p-periodos').innerHTML = '<div class="linha">' + (dados.climaErro ? 'Sem dados do clima (' + dados.climaErro + ').' : 'Carregando...') + '</div>';
      $('p-chuva').innerHTML = '';
    }

    // ---- Trajeto ----
    var o = painelOp && OPCOES[painelOp];
    if (o && o.rota) {
      $('p-cartao-rota').style.display = '';
      $('p-rota-titulo').textContent = 'Trajeto · ' + o.nome;
      var r = dados.rota;
      if (r && r.op === painelOp && Date.now() - r.em < 3 * 3600000) {
        var min = Math.round(r.total / 60), atraso = Math.round(r.atraso / 60);
        var chegada = new Date(Date.now() + r.total * 1000);
        var linhas = '<div class="grande">' + min + ' min</div>' +
          '<div class="linha">' + r.km.toFixed(1).replace('.', ',') + ' km · ' + (atraso > 0 ? atraso + ' min de trânsito a mais que o normal' : 'trânsito normal') + '</div>' +
          '<div class="linha">Saindo agora, chega às ' + hhmm(chegada) + '</div>';
        if (painelOp === 'A' && r.pernas.length === 2) {
          linhas += '<div class="pequeno">Casa → Bar da Tilápia: ' + Math.round(r.pernas[0] / 60) + ' min · Bar → trabalho: ' + Math.round(r.pernas[1] / 60) + ' min</div>';
        }
        $('p-rota').innerHTML = linhas;
      } else {
        $('p-rota').innerHTML = '<div class="linha">' + (dados.rotaErro ? 'Sem trajeto: ' + dados.rotaErro + '.' : 'Calculando...') + '</div>';
      }
      var destino = cfg.pos && cfg.pos[o.rota[1]], origem = cfg.pos && cfg.pos.casa;
      $('p-mapas').href = destino ? 'https://maps.apple.com/?saddr=' + (origem ? origem.lat + ',' + origem.lon : '') +
        '&daddr=' + destino.lat + ',' + destino.lon + '&dirflg=d' : '#';
    } else {
      $('p-cartao-rota').style.display = 'none';
    }
    $('p-atualizado').textContent = dados.climaEm ? 'Clima atualizado às ' + hhmm(new Date(dados.climaEm)) : '';
  }
  $('bt-atualizar').addEventListener('click', function () { buscarDados(painelOp); });
  $('bt-voltar-relogio').addEventListener('click', function () { mostrar('noite'); atualizarNoite(); });

  // ====================================================================
  // Ajustes
  // ====================================================================
  function abrirAjustes() {
    $('aj-casa').value = cfg.casa; $('aj-bar').value = cfg.bar; $('aj-trabalho').value = cfg.trabalho;
    $('aj-hA').value = cfg.hA; $('aj-hB').value = cfg.hB; $('aj-hC').value = cfg.hC; $('aj-alexa').value = cfg.alexa;
    $('aj-volchuva').value = cfg.volChuva; $('aj-subida').value = cfg.subida; $('aj-chave').value = cfg.chave;
    $('aj-msg').textContent = '';
    $('aj-versao').textContent = 'Versão ' + VERSAO + ' · página de teste: /cabeceira/teste.html';
    var nomes = ['casa', 'bar', 'trabalho'];
    for (var i = 0; i < nomes.length; i++) {
      var p = cfg.pos && cfg.pos[nomes[i]];
      $('ac-' + nomes[i]).className = 'achado';
      $('ac-' + nomes[i]).textContent = p ? 'Encontrado: ' + p.nome : 'Ainda não localizado. Toque em Salvar.';
    }
    mostrar('ajustes');
  }
  $('bt-fechar-ajustes').addEventListener('click', function () { mostrar('noite'); atualizarNoite(); });

  function localizar(nome, texto, pronto) {
    var el = $('ac-' + nome);
    if (!cfg.chave) { el.className = 'achado erro'; el.textContent = 'Precisa da chave do TomTom para localizar.'; pronto(); return; }
    el.className = 'achado'; el.textContent = 'Localizando...';
    var url = 'https://api.tomtom.com/search/2/geocode/' + encodeURIComponent(texto) +
      '.json?countrySet=BR&limit=1&language=pt-BR&key=' + encodeURIComponent(cfg.chave);
    buscar(url, function (d) {
      if (d.results && d.results.length) {
        var r = d.results[0];
        cfg.pos[nome] = { lat: r.position.lat, lon: r.position.lon, nome: r.address.freeformAddress };
        el.textContent = 'Encontrado: ' + r.address.freeformAddress;
      } else { delete cfg.pos[nome]; el.className = 'achado erro'; el.textContent = 'Não encontrei esse endereço. Confira a escrita.'; }
      pronto();
    }, function (m) { el.className = 'achado erro'; el.textContent = 'Não consegui localizar (' + m + ').'; pronto(); });
  }

  $('bt-salvar').addEventListener('click', function () {
    var novo = { casa: $('aj-casa').value.trim(), bar: $('aj-bar').value.trim(), trabalho: $('aj-trabalho').value.trim() };
    cfg.hA = $('aj-hA').value || cfg.hA; cfg.hB = $('aj-hB').value || cfg.hB; cfg.hC = $('aj-hC').value || cfg.hC;
    cfg.alexa = $('aj-alexa').value || cfg.alexa;
    cfg.volChuva = $('aj-volchuva').value; cfg.subida = $('aj-subida').value;
    cfg.chave = $('aj-chave').value.replace(/\s/g, '');
    if (!cfg.pos) { cfg.pos = {}; }
    var nomes = ['casa', 'bar', 'trabalho'], faltam = 0;
    function fim() { faltam--; if (faltam <= 0) { salvarCfg(); $('aj-msg').textContent = 'Salvo!'; } }
    for (var i = 0; i < nomes.length; i++) {
      var n = nomes[i];
      if (novo[n] !== cfg[n] || !cfg.pos[n]) { cfg[n] = novo[n]; faltam++; localizar(n, novo[n], fim); }
    }
    if (!faltam) { salvarCfg(); $('aj-msg').textContent = 'Salvo!'; }
    else { $('aj-msg').textContent = 'Localizando endereços...'; }
  });

  $('bt-teste-alarme').addEventListener('click', function () {
    liberarSom();
    var op = (plano && plano.op && plano.op !== 'D') ? plano.op : 'C';
    plano = { op: op, alarmeEm: Date.now() + 2 * 60000, diaAlvo: chaveDia(new Date()), status: 'agendado', buscouDados: false, teste: true };
    salvarPlano();
    $('aj-msg').textContent = 'Alarme de teste (' + OPCOES[op].nome + ') marcado para ' + hhmm(new Date(plano.alarmeEm)) + '. Voltando ao relógio...';
    setTimeout(function () { mostrar('noite'); atualizarNoite(); }, 1500);
  });

  // ====================================================================
  // Relógio central: roda a cada segundo
  // ====================================================================
  var ultimoMinuto = -1;
  function tique() {
    var agora = new Date(), t = agora.getTime();
    if (telaAtual === 'alarme') { $('a-relogio').textContent = hhmm(agora); }
    if (telaAtual === 'painel') { $('p-hora').textContent = hhmm(agora); }
    if (agora.getMinutes() !== ultimoMinuto) { ultimoMinuto = agora.getMinutes(); if (telaAtual === 'noite') { atualizarNoite(); } }

    // Fim do timer da chuva
    if (chuva.fimEm && t >= chuva.fimEm) { pararChuva(false); }

    // Escolha automática: se ninguém escolheu nada até 03:00 de um dia útil, vale "Direto para o trabalho"
    if (agora.getHours() === 3 && diaUtil(agora) && (!plano || plano.diaAlvo !== chaveDia(agora))) {
      var alvoC = proximaOcorrencia(cfg.hC, agora);
      plano = { op: 'C', alarmeEm: alvoC.getTime(), diaAlvo: chaveDia(alvoC), status: 'agendado', buscouDados: false, automatico: true };
      salvarPlano(); atualizarNoite();
    }

    // Fim de semana (sem alarme): às 07:00 do dia escolhido, volta ao modo acordado
    if (plano && plano.status === 'agendado' && !plano.alarmeEm && plano.diaAlvo) {
      var pd = plano.diaAlvo.split('-'), seteHoras = new Date(+pd[0], +pd[1] - 1, +pd[2], 7, 0, 0).getTime();
      if (t >= seteHoras) { plano.status = 'feito'; salvarPlano(); pararChuva(false); if (telaAtual === 'noite') { atualizarNoite(); } }
    }

    if (plano && plano.status === 'agendado' && plano.alarmeEm) {
      // 15 minutos antes: já busca clima e trânsito
      if (!plano.buscouDados && t >= plano.alarmeEm - 15 * 60000) { plano.buscouDados = true; salvarPlano(); buscarDados(plano.op); }
      // Hora do alarme (até 2 horas de atraso, caso a página tenha recarregado)
      if (t >= plano.alarmeEm && t < plano.alarmeEm + 2 * 3600000) { dispararAlarme(); }
      else if (t >= plano.alarmeEm + 2 * 3600000) { plano.status = 'feito'; salvarPlano(); }
    }
  }
  setInterval(tique, 1000);

  // Se a página recarregou com o alarme tocando, volta para a tela de alarme
  if (plano && plano.status === 'tocando') { plano.status = 'agendado'; }
  atualizarNoite();
  tique();

  // Guarda a página no iPad para funcionar sem internet
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
})();
</script>
